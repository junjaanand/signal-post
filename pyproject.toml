[project]
name = "signalpost-agent"
version = "1.0.0"
description = "Autonomous Norwegian company intelligence agent for the Signalpost challenge"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "trafilatura>=1.12",
    "extruct>=0.17",
    "rapidfuzz>=3.9",
    "tldextract>=5.1",
    "phonenumbers>=8.13",
    "feedparser>=6.0",
    "pypdf>=4.3",
    "google-genai>=1.0",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "w3lib>=2.2",
    "lxml>=5.2",
    "selectolax>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/norway_company_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
